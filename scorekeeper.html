<html></html>
    <head>
        <title>Score Keep App </title>
        <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
    <body>
        
        <div id="root" style="text-align: center;"></div>
        <script type="text/babel" >

            let score=0,wicket=0;
            const ballWiseRes=[];
            let eachBall;
            let inputRef=React.createRef();

            const addScore=(num)=>{
                    console.log("clicked button")
                    if(wicket<10){
                        if(num=="wicket"){
                            eachBall=num;
                            // wicket+=1;
                            // console.log(wicket);
                        }
                        else{
                            eachBall=num;
                            // score+=num;
                            // console.log(score);
                        }
                        reactDOM.render(<App/>)
                    }
                }

            function ButtonComponent(){
                return (
                    <div>
                        <button onClick={()=>addScore(0)}>0</button>
                        <button onClick={()=>{return addScore(1)}}>1</button>
                        <button onClick={()=>addScore(2)}>2</button>
                        <button onClick={()=>addScore(3)}>3</button>
                        <button onClick={()=>addScore(4)}>4</button>
                        <button onClick={()=>addScore(5)}>5</button>
                        <button onClick={()=>addScore(6)}>6</button>
                        <button onClick={()=>addScore("wicket")}>wicket</button>
                    </div>
                )
            }

            function CommentComponent(){

                
                const res=ballWiseRes.map((eachball,index)=>{
                   return  <h5 key={index}>{eachball}</h5>
                    
                });

                console.log(res);

                return (
                    <div>
                        <p>{res}</p>
                    </div>
                )
            }

            function handleSubmit(event){
                console.log("submit button clicked")
                event.preventDefault();
                if(wicket<10){
                    ballWiseRes.unshift(${eachBall} , ${inputRef.current.value});
                    inputRef.current.value="";
                    if(eachBall=="wicket")
                        wicket+=1;
                    else{
                        score+=eachBall;
                    }
                }
                reactDOM.render(<App/>)
            }

            function FormComponent(){
                return (
                    <form onSubmit={handleSubmit}>
                        <input value={eachBall}/>
                        <input ref={inputRef} placeholder="Add a Comment" />
                        <button>Submit</button>
                    </form>
                )
            }

            function App(){

                
              

                return (
                    <>
                    <h1>Score Keeper</h1>
                    <h2>Score: {score}/{wicket}</h2>
                    <ButtonComponent/>
                    <br/>
                    <FormComponent/>
                    <hr/>
                    <CommentComponent/>
                    </>
                )
            }

            const reactDOM=ReactDOM.createRoot(document.getElementById("root"));
            reactDOM.render(<App/>)
        </script>
    </body>
</html>
